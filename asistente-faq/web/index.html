<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente de preguntas frecuentes</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- Altura fija y desplazamiento interno: el marco embebido no se
       redimensiona al crecer el contenido. -->
  <main class="asistente" role="main">
    <header class="cabecera">
      <h1>Asistente de preguntas frecuentes</h1>
    </header>

    <!-- La conversacion no es region viva: contiene botones, y el lector de
         pantalla los leeria todos cada vez. Solo los mensajes del asistente
         se anuncian, por #anuncio. -->
    <div id="conversacion" class="conversacion" aria-label="Conversación"></div>
    <div id="anuncio" class="oculto" role="status" aria-live="polite"></div>

    <div class="entrada-zona">
      <label class="oculto" for="entrada">Escribe tu consulta</label>
      <input
        id="entrada"
        type="text"
        placeholder="Escribe tu consulta…"
        autocomplete="off"
        disabled>
      <button id="enviar" type="button">Enviar</button>
    </div>
  </main>

  <!-- TensorFlow.js (lib/tf.min.js) no se carga aqui: motor.js lo pide en
       segundo plano para que el menu aparezca sin esperarlo. -->
  <script src="preprocesamiento.js"></script>
  <script src="motor.js"></script>
  <script src="interfaz.js"></script>
</body>
</html>
