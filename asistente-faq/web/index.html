<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente de preguntas frecuentes</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- Altura fija y desplazamiento interno: el marco embebido no se
       redimensiona al crecer el contenido. -->
  <main class="asistente" role="main">
    <header class="cabecera">
      <h1>Asistente de preguntas frecuentes</h1>
    </header>

    <div id="conversacion" class="conversacion" aria-live="polite"></div>

    <div class="entrada-zona">
      <label class="oculto" for="entrada">Escribe tu consulta</label>
      <input
        id="entrada"
        type="text"
        placeholder="Escribe tu consulta…"
        autocomplete="off"
        disabled>
      <button id="enviar" type="button">Enviar</button>
    </div>
  </main>

  <!-- TensorFlow.js empaquetado localmente (lib/tf.min.js, version 4.22.0,
       licencia Apache 2.0): sin dependencia de un CDN ni de un dominio fijo,
       para que el entregable funcione en cualquier alojamiento. -->
  <script src="lib/tf.min.js"></script>
  <script src="preprocesamiento.js"></script>
  <script src="motor.js"></script>
  <script src="interfaz.js"></script>
</body>
</html>
